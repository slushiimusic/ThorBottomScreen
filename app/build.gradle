plugins { id 'com.android.application' }

android {
    namespace 'dev.slushii.thorbottom'
    compileSdk 35

    defaultConfig {
        applicationId "dev.slushii.thorbottom"
        minSdk 30
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        aidl true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku: lets the app run a tiny helper process as the shell user, which is the
    // only way a non-system app can write the vendor's dual_screen_display_mode key.
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
